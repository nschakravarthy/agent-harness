services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - backend-network
    
  frontend:
    image: node:20-alpine
    # No container_name, for the same reason as postgres-db below.
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Point the Vite dev proxy at the backend service on the compose network
      - VITE_API_TARGET=http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - backend-network

  postgres-db:
    image: postgres:15-alpine
    # No container_name: it forces a globally-unique name and collides with the
    # postgres-db of other compose projects. Compose scopes the default name to
    # this project instead.
    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=testadmin
      - POSTGRES_PASSWORD=test1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testadmin -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx-proxy
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - backend
  #   networks:
  #     - backend-network
  
networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
