[project]
name = "agent-harness"
version = "0.1.0"
description = "Building an agent harness from scratch."
authors = [
    {name = "srini"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    # Web layer
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.46.0,<0.47.0)",
    # Settings / validation
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    # Persistence. asyncpg is the only driver: Postgres is the sole backend.
    # SQLAlchemy's async layer needs greenlet, which SQLAlchemy itself only
    # pulls in behind a marker listing aarch64 but not arm64, so Apple Silicon
    # misses it unless it is declared here.
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "greenlet (>=3.0.0,<4.0.0)",
    # Auth
    "pyjwt (>=2.12.1,<3.0.0)",
    "argon2-cffi (>=23.1.0,<24.0.0)",
    "anthropic (>=1.7.0,<2.0.0)",
    # Used by the examples to read .env when they run outside Docker.
    "python-dotenv (>=1.0.0,<2.0.0)",
    "openai (>=3.16.2,<4.0.0)"
]


[tool.poetry]
# Installed into the venv in editable mode (`poetry install`) so that `harness`
# and `api` import from anywhere, not just when the repo root happens to be the
# working directory. Both are namespace packages, so they are listed explicitly.
packages = [
    { include = "harness" },
    { include = "api" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    # Required by starlette's TestClient; not used by the app at runtime.
    "httpx (>=0.28.1,<0.29.0)"
]


# ── Test configuration ───────────────────────────────────────────────────
# Tiers live in tests/<tier>/ and are auto-marked by tests/conftest.py, so
# `pytest -m unit` works without repeating the marker on every test.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# `api` and `harness` are namespace packages at the repo root rather than an
# installed distribution, so the root has to be on sys.path.
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # importlib keeps same-named test modules in different tiers (e.g.
    # unit/harness/test_messages.py and smoke/test_messages.py) from clashing.
    "--import-mode=importlib",
]
markers = [
    "unit: no I/O - pure logic, runs everywhere in milliseconds",
    "integration: drives the ASGI app against a real Postgres test database",
    "e2e: drives a already-running server over HTTP",
    "smoke: shallow post-deploy checks that the system is wired up and alive",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Not `error`: api/core/models.py still calls datetime.utcnow(), which Python
# 3.12 deprecates. Tighten this once that is fixed.
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy.*",
]

[tool.coverage.run]
branch = true
source = ["api", "harness"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
