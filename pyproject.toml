[project]
name = "agent-harness"
version = "0.1.0"
description = "Building an agent harness from scratch."
authors = [
    {name = "srini"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    # Web layer
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.46.0,<0.47.0)",
    # Settings / validation
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    # Persistence. asyncpg is the only driver: Postgres is the sole backend.
    # SQLAlchemy's async layer needs greenlet, which SQLAlchemy itself only
    # pulls in behind a marker listing aarch64 but not arm64, so Apple Silicon
    # misses it unless it is declared here.
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "greenlet (>=3.0.0,<4.0.0)",
    # Auth
    "pyjwt (>=2.12.1,<3.0.0)",
    "argon2-cffi (>=23.1.0,<24.0.0)",
    "anthropic (>=1.7.0,<2.0.0)",
    "openai (>=3.16.2,<4.0.0)"
]


# Poetry is used for dependency management only: no package is built or
# installed from this repo, so there is no [build-system] section and the
# project root is never installed into the virtualenv.
[tool.poetry]
package-mode = false

# Nothing is installed into the virtualenv, so the repo root has to be put on
# sys.path explicitly for tests to import `harness` / `api`. Outside pytest,
# run scripts as modules from the root (python -m tests.<name>) so the CWD
# lands on sys.path the same way.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    # Required by starlette's TestClient; not used by the app at runtime.
    "httpx (>=0.28.1,<0.29.0)"
]
