# pyproject.toml
[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5.0",
    "dotenv>=0.9.9",
    "httpx>=0.27",
    "openai>=3.13.0",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
# tests/unit  — one module under test, everything else stubbed.
# tests/e2e   — the whole loop: agent, provider, registry, real filesystem.
testpaths = ["tests/unit", "tests/e2e"]
markers = [
    "live: hits a real provider API; needs credentials and costs money",
]
addopts = "-m 'not live'"
